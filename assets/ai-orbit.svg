<svg width="1200" height="420" viewBox="0 0 1200 420"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="blueTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="28" fill="#FFFFFF"/>

  <!-- Decorative grid -->
  <g opacity="0.08" stroke="#2563EB">
    <path d="M0 70 H1200"/>
    <path d="M0 140 H1200"/>
    <path d="M0 210 H1200"/>
    <path d="M0 280 H1200"/>
    <path d="M0 350 H1200"/>
  </g>

  <!-- Main title -->
  <text x="600" y="100"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="700"
        fill="#172554">
    Welcome to My AI Journey
  </text>

  <!-- Subtitle -->
  <text x="600" y="140"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#475569">
    Kethavath Mahendar Nayak • AI/ML Learner • Web Designer
  </text>

  <!-- Orbit system -->
  <g transform="translate(600 265)">

    <!-- Orbit rings -->
    <ellipse rx="250" ry="85"
             fill="none"
             stroke="#2563EB"
             stroke-width="3"
             opacity="0.35"/>

    <ellipse rx="180" ry="60"
             fill="none"
             stroke="#14B8A6"
             stroke-width="3"
             opacity="0.35"
             transform="rotate(60)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0"
        to="360"
        dur="14s"
        repeatCount="indefinite"/>
    </ellipse>

    <ellipse rx="180" ry="60"
             fill="none"
             stroke="#2563EB"
             stroke-width="2"
             opacity="0.3"
             transform="rotate(-60)">
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="360"
        to="0"
        dur="18s"
        repeatCount="indefinite"/>
    </ellipse>

    <!-- Central AI node -->
    <circle r="55"
            fill="url(#blueTeal)"
            filter="url(#glow)">
      <animate
        attributeName="r"
        values="52;58;52"
        dur="2.5s"
        repeatCount="indefinite"/>
    </circle>

    <text x="0" y="10"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="24"
          font-weight="700"
          fill="#FFFFFF">
      AI
    </text>

    <!-- Orbiting nodes -->
    <g>
      <circle cx="250" cy="0" r="13" fill="#2563EB">
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="8s"
          repeatCount="indefinite"/>
      </circle>

      <circle cx="-250" cy="0" r="13" fill="#14B8A6">
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="360 0 0"
          to="0 0 0"
          dur="10s"
          repeatCount="indefinite"/>
      </circle>
    </g>

  </g>

  <!-- Bottom labels -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="16"
     font-weight="600"
     text-anchor="middle">

    <text x="300" y="390" fill="#2563EB">
      AI &amp; ML
    </text>

    <text x="600" y="390" fill="#475569">
      DSA
    </text>

    <text x="900" y="390" fill="#14B8A6">
      Web Design
    </text>

  </g>

</svg>